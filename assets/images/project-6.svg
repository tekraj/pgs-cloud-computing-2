<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#0a192f"/>
  <pattern id="g6" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="1.2" fill="rgba(100,255,218,0.05)"/>
  </pattern>
  <rect width="800" height="480" fill="url(#g6)"/>
  <!-- Fitness/Social App UI -->
  <!-- Phone frame -->
  <rect x="270" y="50" width="260" height="370" rx="20" fill="rgba(17,34,64,0.97)" stroke="rgba(100,255,218,0.25)" stroke-width="2"/>
  <rect x="330" y="58" width="140" height="8" rx="4" fill="rgba(35,53,84,0.9)"/>
  <!-- Status icons -->
  <text x="290" y="86" fill="#8892b0" font-family="Inter, sans-serif" font-size="9">9:41</text>
  <!-- App header -->
  <text x="400" y="104" text-anchor="middle" fill="#64ffda" font-family="Inter, sans-serif" font-size="14" font-weight="700">FitTrack</text>
  <!-- Profile avatar -->
  <circle cx="400" cy="150" r="35" fill="rgba(35,53,84,0.9)" stroke="rgba(100,255,218,0.25)" stroke-width="2"/>
  <text x="400" y="155" text-anchor="middle" fill="#ccd6f6" font-family="Inter, sans-serif" font-size="12">AM</text>
  <text x="400" y="200" text-anchor="middle" fill="#ccd6f6" font-family="Inter, sans-serif" font-size="12" font-weight="600">Alex Morgan</text>
  <!-- Stats row -->
  <rect x="284" y="215" width="64" height="48" rx="6" fill="rgba(35,53,84,0.7)"/>
  <text x="316" y="234" text-anchor="middle" fill="#64ffda" font-family="Inter, sans-serif" font-size="14" font-weight="700">127</text>
  <text x="316" y="250" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="8">Workouts</text>
  <rect x="368" y="215" width="64" height="48" rx="6" fill="rgba(35,53,84,0.7)"/>
  <text x="400" y="234" text-anchor="middle" fill="#64ffda" font-family="Inter, sans-serif" font-size="14" font-weight="700">48</text>
  <text x="400" y="250" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="8">Following</text>
  <rect x="452" y="215" width="64" height="48" rx="6" fill="rgba(35,53,84,0.7)"/>
  <text x="484" y="234" text-anchor="middle" fill="#64ffda" font-family="Inter, sans-serif" font-size="14" font-weight="700">94</text>
  <text x="484" y="250" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="8">Followers</text>
  <!-- Progress bar -->
  <text x="290" y="287" fill="#8892b0" font-family="Inter, sans-serif" font-size="9">Today's Goal</text>
  <rect x="284" y="292" width="232" height="8" rx="4" fill="rgba(35,53,84,0.8)"/>
  <rect x="284" y="292" width="148" height="8" rx="4" fill="rgba(100,255,218,0.5)"/>
  <rect x="284" y="316" width="232" height="40" rx="6" fill="rgba(100,255,218,0.12)" stroke="rgba(100,255,218,0.2)" stroke-width="1"/>
  <text x="400" y="340" text-anchor="middle" fill="#64ffda" font-family="Inter, sans-serif" font-size="11" font-weight="600">Start Workout</text>
  <!-- Home indicator -->
  <rect x="360" y="400" width="80" height="4" rx="2" fill="rgba(100,255,218,0.2)"/>
  <text x="400" y="456" text-anchor="middle" fill="rgba(100,255,218,0.35)" font-family="Courier New, monospace" font-size="12" letter-spacing="2">[ FITNESS TRACKER APP — PROJECT SCREENSHOT ]</text>
</svg>
