<svg xmlns="http://www.w3.org/2000/svg" width="420" height="480" viewBox="0 0 420 480">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="fig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d3054"/>
      <stop offset="100%" stop-color="#233554"/>
    </linearGradient>
  </defs>
  <rect width="420" height="480" fill="url(#bg2)" rx="4"/>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1" fill="rgba(100,255,218,0.06)"/>
  </pattern>
  <rect width="420" height="480" fill="url(#dots)" rx="4"/>
  <!-- Camera icon to indicate photo area -->
  <circle cx="210" cy="175" r="82" fill="url(#fig)"/>
  <rect x="178" y="242" width="44" height="32" fill="url(#fig)"/>
  <ellipse cx="210" cy="405" rx="148" ry="118" fill="url(#fig)"/>
  <rect x="1" y="1" width="418" height="478" fill="none" stroke="#64ffda" stroke-width="1.5" stroke-opacity="0.2" rx="4"/>
  <rect x="100" y="448" width="220" height="24" rx="3" fill="rgba(100,255,218,0.08)"/>
  <text x="210" y="464" text-anchor="middle" fill="#64ffda" font-family="Courier New, monospace" font-size="11" letter-spacing="1.5">ABOUT PHOTO HERE</text>
</svg>
