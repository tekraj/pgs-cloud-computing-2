<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b34"/>
      <stop offset="100%" stop-color="#112240"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#sky)"/>
  <pattern id="dots4" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="rgba(100,255,218,0.05)"/>
  </pattern>
  <rect width="800" height="480" fill="url(#dots4)"/>
  <!-- Weather dashboard card -->
  <rect x="100" y="60" width="600" height="320" rx="8" fill="rgba(17,34,64,0.97)" stroke="rgba(100,255,218,0.2)" stroke-width="1.5"/>
  <!-- Header -->
  <text x="400" y="110" text-anchor="middle" fill="#64ffda" font-family="Inter, sans-serif" font-size="22" font-weight="700">San Francisco, CA</text>
  <text x="400" y="132" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="11">Monday, May 19 · Updated just now</text>
  <!-- Big temp -->
  <text x="350" y="210" text-anchor="middle" fill="#e6f1ff" font-family="Inter, sans-serif" font-size="72" font-weight="300">68°</text>
  <!-- Weather icon (sun) -->
  <circle cx="490" cy="180" r="28" fill="rgba(243,156,18,0.25)" stroke="rgba(243,156,18,0.5)" stroke-width="2"/>
  <circle cx="490" cy="180" r="18" fill="rgba(243,156,18,0.4)"/>
  <!-- Rays -->
  <line x1="490" y1="142" x2="490" y2="150" stroke="rgba(243,156,18,0.5)" stroke-width="2"/>
  <line x1="490" y1="210" x2="490" y2="218" stroke="rgba(243,156,18,0.5)" stroke-width="2"/>
  <line x1="452" y1="180" x2="460" y2="180" stroke="rgba(243,156,18,0.5)" stroke-width="2"/>
  <line x1="520" y1="180" x2="528" y2="180" stroke="rgba(243,156,18,0.5)" stroke-width="2"/>
  <text x="400" y="240" text-anchor="middle" fill="#ccd6f6" font-family="Inter, sans-serif" font-size="14">Partly Cloudy · Feels like 65°</text>
  <!-- Stats row -->
  <rect x="120" y="265" width="130" height="55" rx="4" fill="rgba(35,53,84,0.7)"/>
  <text x="185" y="286" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="9" letter-spacing="1">HUMIDITY</text>
  <text x="185" y="306" text-anchor="middle" fill="#64ffda" font-family="Inter, sans-serif" font-size="18" font-weight="700">72%</text>
  <rect x="270" y="265" width="130" height="55" rx="4" fill="rgba(35,53,84,0.7)"/>
  <text x="335" y="286" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="9" letter-spacing="1">WIND</text>
  <text x="335" y="306" text-anchor="middle" fill="#64ffda" font-family="Inter, sans-serif" font-size="18" font-weight="700">12 mph</text>
  <rect x="420" y="265" width="130" height="55" rx="4" fill="rgba(35,53,84,0.7)"/>
  <text x="485" y="286" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="9" letter-spacing="1">UV INDEX</text>
  <text x="485" y="306" text-anchor="middle" fill="#64ffda" font-family="Inter, sans-serif" font-size="18" font-weight="700">5</text>
  <rect x="570" y="265" width="110" height="55" rx="4" fill="rgba(35,53,84,0.7)"/>
  <text x="625" y="286" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="9" letter-spacing="1">VISIBILITY</text>
  <text x="625" y="306" text-anchor="middle" fill="#64ffda" font-family="Inter, sans-serif" font-size="18" font-weight="700">10 mi</text>
  <text x="400" y="456" text-anchor="middle" fill="rgba(100,255,218,0.35)" font-family="Courier New, monospace" font-size="12" letter-spacing="2">[ WEATHER DASHBOARD — PROJECT SCREENSHOT ]</text>
</svg>
