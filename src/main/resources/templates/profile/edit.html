<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile — TodoApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; }
        .form-card {
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 24px rgba(0,0,0,.06);
        }
        .form-control:focus, .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.2rem rgba(99,102,241,.15);
        }
        .avatar-preview {
            width: 80px; height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e2e8f0;
        }
        .avatar-initials {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg,#6366f1,#8b5cf6);
            font-size: 2rem; font-weight: 700; color: #fff;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid #e2e8f0;
        }
        .section-title {
            font-size: .7rem; text-transform: uppercase; letter-spacing: .7px;
            color: #94a3b8; font-weight: 600; margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width:640px;">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/profile}" class="text-decoration-none" style="color:#6366f1;">Profile</a></li>
            <li class="breadcrumb-item active">Edit Profile</li>
        </ol>
    </nav>

    <div class="card form-card bg-white">
        <div class="card-header bg-white border-bottom px-4 py-3">
            <h5 class="mb-0 fw-bold">
                <i class="bi bi-person-gear me-2" style="color:#6366f1;"></i>Edit Profile
            </h5>
        </div>
        <div class="card-body px-4 py-4">

            <!-- Error / success notifications -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
                <i class="bi bi-exclamation-circle me-1"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/profile}" method="post"
                  th:object="${profileDto}"
                  enctype="multipart/form-data"
                  novalidate>

                <!-- ── Profile Picture ── -->
                <div class="mb-4">
                    <div class="section-title">Profile Picture</div>
                    <div class="d-flex align-items-center gap-3 mb-2">
                            <img th:if="${profileImageUrl != null and !profileImageUrl.isEmpty()}"
                                th:src="${profileImageUrl}"
                             class="avatar-preview" alt="Current avatar" id="avatarPreview">
                            <div th:unless="${profileImageUrl != null and !profileImageUrl.isEmpty()}"
                             class="avatar-initials" id="avatarInitials"
                             th:text="${#strings.substring(profileUser.username,0,1).toUpperCase()}">U</div>
                        <div>
                            <label for="profilePicFile" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-upload me-1"></i>Choose Image
                            </label>
                            <input type="file" id="profilePicFile" name="profilePicFile"
                                   accept="image/*" class="d-none" onchange="previewImage(event)">
                            <div class="text-muted mt-1" style="font-size:11px;">JPG, PNG, GIF — max 5 MB</div>
                        </div>
                    </div>
                </div>

                <hr class="my-3">

                <!-- ── Basic Info ── -->
                <div class="mb-4">
                    <div class="section-title">Basic Information</div>

                    <div class="mb-3">
                        <label for="fullName" class="form-label fw-semibold small">Full Name</label>
                        <input type="text" id="fullName" th:field="*{fullName}"
                               class="form-control" placeholder="Your full name">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">
                            Email <span class="text-danger">*</span>
                        </label>
                        <input type="email" id="email" th:field="*{email}"
                               class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="you@example.com">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="bio" class="form-label fw-semibold small">Bio</label>
                        <textarea id="bio" th:field="*{bio}"
                                  class="form-control" th:classappend="${#fields.hasErrors('bio')} ? 'is-invalid' : ''"
                                  rows="3" placeholder="Tell us a bit about yourself..."></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}"></div>
                    </div>
                </div>

                <hr class="my-3">

                <!-- ── Change Password ── -->
                <div class="mb-4">
                    <div class="section-title">Change Password <span class="text-muted fw-normal">(leave blank to keep current)</span></div>

                    <div class="mb-3">
                        <label for="currentPassword" class="form-label fw-semibold small">Current Password</label>
                        <input type="password" id="currentPassword" th:field="*{currentPassword}"
                               class="form-control" placeholder="Enter current password"
                               autocomplete="current-password">
                    </div>

                    <div class="mb-3">
                        <label for="newPassword" class="form-label fw-semibold small">New Password</label>
                        <input type="password" id="newPassword" th:field="*{newPassword}"
                               class="form-control" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                               placeholder="Min. 6 characters"
                               autocomplete="new-password">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                    <a th:href="@{/profile}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-sm text-white px-4"
                            style="background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;">
                        <i class="bi bi-save me-1"></i>Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            // Replace existing avatar with preview img
            const container = document.querySelector('.d-flex.align-items-center.gap-3');
            let img = document.getElementById('avatarPreview');
            const initials = document.getElementById('avatarInitials');
            if (!img) {
                img = document.createElement('img');
                img.id = 'avatarPreview';
                img.className = 'avatar-preview';
                img.alt = 'Preview';
                if (initials) initials.replaceWith(img);
                else container.prepend(img);
            }
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
