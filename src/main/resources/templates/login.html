<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — TodoApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
        }
        .auth-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            padding: 2rem;
            text-align: center;
            color: #fff;
        }
        .auth-header .brand-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .auth-body { padding: 2rem; }
        .form-control:focus { border-color: #6366f1; box-shadow: 0 0 0 0.2rem rgba(99,102,241,.15); }
        .btn-primary-custom {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 8px;
            padding: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: opacity .2s;
        }
        .btn-primary-custom:hover { opacity: .9; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-header">
        <div class="brand-icon"><i class="bi bi-check2-square"></i></div>
        <h4 class="fw-bold mb-0">Welcome back</h4>
        <p class="mb-0 opacity-75 small">Sign in to your TodoApp account</p>
    </div>
    <div class="auth-body">
        <!-- Flash messages -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show py-2 small" role="alert">
            <i class="bi bi-check-circle me-1"></i><span th:text="${message}"></span>
            <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small text-muted text-uppercase" style="letter-spacing:.5px;">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" id="username" name="username" class="form-control border-start-0 ps-0"
                           placeholder="Enter your username" autocomplete="username" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold small text-muted text-uppercase" style="letter-spacing:.5px;">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" id="password" name="password" class="form-control border-start-0 ps-0"
                           placeholder="Enter your password" autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary-custom text-white w-100 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>
        <div class="text-center">
            <span class="text-muted small">Don't have an account?</span>
            <a th:href="@{/register}" class="text-decoration-none fw-semibold ms-1 small" style="color:#6366f1;">Create one</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
