<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — TodoApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .auth-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            overflow: hidden;
            width: 100%;
            max-width: 460px;
        }
        .auth-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            padding: 1.75rem 2rem;
            text-align: center;
            color: #fff;
        }
        .auth-body { padding: 2rem; }
        .form-control:focus { border-color: #6366f1; box-shadow: 0 0 0 0.2rem rgba(99,102,241,.15); }
        .btn-primary-custom {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none; border-radius: 8px;
            padding: 0.65rem; font-weight: 600;
            transition: opacity .2s;
        }
        .btn-primary-custom:hover { opacity: .9; }
        .field-error { font-size: 12px; color: #dc3545; margin-top: 4px; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-header">
        <div style="font-size:2rem;margin-bottom:.5rem;"><i class="bi bi-person-plus"></i></div>
        <h4 class="fw-bold mb-0">Create Account</h4>
        <p class="mb-0 opacity-75 small">Join TodoApp and stay organized</p>
    </div>
    <div class="auth-body">
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/register}" method="post" th:object="${registerDto}" novalidate>
            <!-- Full Name (optional) -->
            <div class="mb-3">
                <label for="fullName" class="form-label fw-semibold small text-muted text-uppercase" style="letter-spacing:.5px;">
                    Full Name <span class="text-muted fw-normal">(optional)</span>
                </label>
                <input type="text" id="fullName" th:field="*{fullName}"
                       class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                       placeholder="John Doe">
            </div>

            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small text-muted text-uppercase" style="letter-spacing:.5px;">
                    Username <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-at text-muted"></i></span>
                    <input type="text" id="username" th:field="*{username}"
                           class="form-control border-start-0 ps-0" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                           placeholder="your_username" autocomplete="username">
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold small text-muted text-uppercase" style="letter-spacing:.5px;">
                    Email <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" id="email" th:field="*{email}"
                           class="form-control border-start-0 ps-0" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           placeholder="you@example.com" autocomplete="email">
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold small text-muted text-uppercase" style="letter-spacing:.5px;">
                    Password <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" id="password" th:field="*{password}"
                           class="form-control border-start-0 ps-0" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           placeholder="Min. 6 characters" autocomplete="new-password">
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold small text-muted text-uppercase" style="letter-spacing:.5px;">
                    Confirm Password <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock text-muted"></i></span>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           class="form-control border-start-0 ps-0" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                           placeholder="Repeat your password" autocomplete="new-password">
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn btn-primary-custom text-white w-100 mb-3">
                <i class="bi bi-person-check me-2"></i>Create Account
            </button>
        </form>
        <div class="text-center">
            <span class="text-muted small">Already have an account?</span>
            <a th:href="@{/login}" class="text-decoration-none fw-semibold ms-1 small" style="color:#6366f1;">Sign in</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
