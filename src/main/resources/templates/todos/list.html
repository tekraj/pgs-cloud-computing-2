<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My TODOs — TodoApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; }

        /* Priority left-border colouring via CSS classes */
        .priority-HIGH  { border-left: 4px solid #ef4444 !important; }
        .priority-MEDIUM{ border-left: 4px solid #f97316 !important; }
        .priority-LOW   { border-left: 4px solid #22c55e !important; }

        .todo-card {
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            transition: box-shadow .18s;
        }
        .todo-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,.08); }

        .todo-completed .card-title { text-decoration: line-through; color: #94a3b8; }
        .todo-completed { opacity: .75; }

        .stat-card {
            border-radius: 12px;
            border: none;
        }
        .filter-btn { border-radius: 20px; font-size: .8rem; padding: 4px 14px; }

        .badge-priority-HIGH   { background-color: #fee2e2; color: #b91c1c; }
        .badge-priority-MEDIUM { background-color: #ffedd5; color: #c2410c; }
        .badge-priority-LOW    { background-color: #dcfce7; color: #15803d; }

        .empty-state { padding: 4rem 0; text-align: center; color: #94a3b8; }
        .empty-state i { font-size: 4rem; margin-bottom: 1rem; }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width:900px;">

    <!-- Flash alerts -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show py-2 small" role="alert">
        <i class="bi bi-check-circle me-1"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
        <i class="bi bi-exclamation-circle me-1"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
    </div>

    <!-- Stats row -->
    <div class="row g-3 mb-4">
        <div class="col-4">
            <div class="card stat-card h-100 text-center py-3" style="background:#eef2ff;">
                <div class="fw-bold fs-3 mb-0" style="color:#6366f1;" th:text="${totalCount}">0</div>
                <div class="text-muted small">Total</div>
            </div>
        </div>
        <div class="col-4">
            <div class="card stat-card h-100 text-center py-3" style="background:#f0fdf4;">
                <div class="fw-bold fs-3 mb-0" style="color:#22c55e;" th:text="${completedCount}">0</div>
                <div class="text-muted small">Completed</div>
            </div>
        </div>
        <div class="col-4">
            <div class="card stat-card h-100 text-center py-3" style="background:#fff7ed;">
                <div class="fw-bold fs-3 mb-0" style="color:#f97316;" th:text="${pendingCount}">0</div>
                <div class="text-muted small">Pending</div>
            </div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
        <div class="d-flex flex-wrap gap-2">
            <!-- Status filters -->
            <a th:href="@{/todos}" class="btn filter-btn"
               th:classappend="${activeFilter == null and activePriority == null} ? 'btn-dark' : 'btn-outline-secondary'">All</a>
            <a th:href="@{/todos(filter='active')}" class="btn filter-btn"
               th:classappend="${activeFilter == 'active'} ? 'btn-warning text-dark' : 'btn-outline-secondary'">Active</a>
            <a th:href="@{/todos(filter='completed')}" class="btn filter-btn"
               th:classappend="${activeFilter == 'completed'} ? 'btn-success' : 'btn-outline-secondary'">Completed</a>

            <span class="text-muted align-self-center mx-1" style="font-size:.75rem;">|</span>

            <!-- Priority filters -->
            <a th:href="@{/todos(priority='HIGH')}" class="btn filter-btn"
               th:classappend="${activePriority == 'HIGH'} ? 'btn-danger' : 'btn-outline-danger'">High</a>
            <a th:href="@{/todos(priority='MEDIUM')}" class="btn filter-btn"
               th:classappend="${activePriority == 'MEDIUM'} ? 'btn-warning text-dark' : 'btn-outline-warning'">Medium</a>
            <a th:href="@{/todos(priority='LOW')}" class="btn filter-btn"
               th:classappend="${activePriority == 'LOW'} ? 'btn-success' : 'btn-outline-success'">Low</a>
        </div>
        <a th:href="@{/todos/new}" class="btn btn-sm text-white px-3" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;">
            <i class="bi bi-plus-lg me-1"></i>New TODO
        </a>
    </div>

    <!-- TODO list -->
    <div th:if="${todos.isEmpty()}" class="empty-state">
        <i class="bi bi-clipboard2-x d-block"></i>
        <h5 class="fw-semibold">No TODOs found</h5>
        <p class="small">Add your first TODO to get started.</p>
        <a th:href="@{/todos/new}" class="btn btn-sm text-white px-4" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;">
            <i class="bi bi-plus-lg me-1"></i>Add TODO
        </a>
    </div>

    <div th:each="todo : ${todos}">
        <div class="card todo-card mb-3 bg-white"
             th:classappend="'priority-' + ${todo.priority.name()} + (${todo.completed} ? ' todo-completed' : '')">
            <div class="card-body py-3 px-3">
                <div class="d-flex justify-content-between align-items-start gap-3">
                    <!-- Left: content -->
                    <div class="flex-grow-1 min-width-0">
                        <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                            <!-- Completion toggle as a clickable checkbox-style icon -->
                            <form th:action="@{/todos/{id}/toggle(id=${todo.id})}" method="post" class="d-inline m-0">
                                <button type="submit" class="btn btn-link p-0 border-0" style="line-height:1;"
                                        th:title="${todo.completed} ? 'Mark Active' : 'Mark Complete'">
                                    <i class="bi fs-5"
                                       th:classappend="${todo.completed} ? 'bi-check-circle-fill text-success' : 'bi-circle text-muted'"></i>
                                </button>
                            </form>
                            <h6 class="card-title mb-0 fw-semibold" th:text="${todo.title}">Title</h6>
                        </div>
                        <p th:if="${todo.description != null and !todo.description.isEmpty()}"
                           class="card-text text-muted small mb-2 ms-4"
                           th:text="${#strings.abbreviate(todo.description, 120)}"></p>
                        <div class="d-flex align-items-center gap-3 ms-4 flex-wrap">
                            <!-- Priority badge -->
                            <span class="badge rounded-pill fw-normal small"
                                  th:classappend="'badge-priority-' + ${todo.priority.name()}"
                                  th:text="${todo.priority}">MEDIUM</span>
                            <!-- Due date -->
                            <span th:if="${todo.dueDate != null}" class="text-muted small">
                                <i class="bi bi-calendar3 me-1"></i>
                                <span th:text="${#temporals.format(todo.dueDate, 'MMM dd, yyyy')}"></span>
                            </span>
                            <!-- Created -->
                            <span class="text-muted small">
                                <i class="bi bi-clock me-1"></i>
                                <span th:text="${#temporals.format(todo.createdAt, 'MMM dd')}"></span>
                            </span>
                        </div>
                    </div>
                    <!-- Right: actions -->
                    <div class="d-flex gap-1 flex-shrink-0">
                        <a th:href="@{/todos/{id}/edit(id=${todo.id})}"
                           class="btn btn-sm btn-outline-secondary border-0" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post" class="m-0"
                              onsubmit="return confirm('Delete this TODO?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger border-0" title="Delete">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
