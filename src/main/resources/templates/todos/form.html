<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' — TodoApp'">TODO Form — TodoApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; }
        .form-card {
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 24px rgba(0,0,0,.06);
        }
        .form-control:focus, .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.2rem rgba(99,102,241,.15);
        }
        .priority-option-HIGH   { color: #b91c1c; }
        .priority-option-MEDIUM { color: #c2410c; }
        .priority-option-LOW    { color: #15803d; }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width:620px;">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/todos}" class="text-decoration-none" style="color:#6366f1;">My TODOs</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${pageTitle}">Form</li>
        </ol>
    </nav>

    <div class="card form-card bg-white">
        <div class="card-header bg-white border-bottom px-4 py-3">
            <h5 class="mb-0 fw-bold">
                <i class="bi me-2" th:classappend="${todoId != null} ? 'bi-pencil-square' : 'bi-plus-circle'" style="color:#6366f1;"></i>
                <span th:text="${pageTitle}">New TODO</span>
            </h5>
        </div>
        <div class="card-body px-4 py-4">

            <!-- POST to /todos for create, /todos/{id} for update -->
            <form th:action="${todoId != null} ? @{/todos/{id}(id=${todoId})} : @{/todos}"
                  method="post"
                  th:object="${todoForm}"
                  novalidate>

                <!-- Title -->
                <div class="mb-3">
                    <label for="title" class="form-label fw-semibold small text-uppercase text-muted" style="letter-spacing:.5px;">
                        Title <span class="text-danger">*</span>
                    </label>
                    <input type="text" id="title" th:field="*{title}"
                           class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                           placeholder="What needs to be done?" autofocus>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold small text-uppercase text-muted" style="letter-spacing:.5px;">
                        Description
                    </label>
                    <textarea id="description" th:field="*{description}"
                              class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                              rows="4"
                              placeholder="Add more details (optional)..."></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="row g-3">
                    <!-- Priority -->
                    <div class="col-md-6">
                        <label for="priority" class="form-label fw-semibold small text-uppercase text-muted" style="letter-spacing:.5px;">
                            Priority
                        </label>
                        <select id="priority" th:field="*{priority}" class="form-select">
                            <option th:each="p : ${priorities}"
                                    th:value="${p}"
                                    th:text="${p}"
                                    th:selected="${todoForm.priority == p}"></option>
                        </select>
                    </div>

                    <!-- Due Date -->
                    <div class="col-md-6">
                        <label for="dueDate" class="form-label fw-semibold small text-uppercase text-muted" style="letter-spacing:.5px;">
                            Due Date
                        </label>
                        <input type="date" id="dueDate" th:field="*{dueDate}"
                               class="form-control"
                               th:value="${todoForm.dueDate != null ? #temporals.format(todoForm.dueDate,'yyyy-MM-dd') : ''}">
                    </div>
                </div>

                <!-- Actions -->
                <div class="d-flex justify-content-between align-items-center mt-4 pt-2 border-top">
                    <a th:href="@{/todos}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-sm text-white px-4"
                            style="background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;">
                        <i class="bi me-1" th:classappend="${todoId != null} ? 'bi-save' : 'bi-plus-lg'"></i>
                        <span th:text="${todoId != null} ? 'Save Changes' : 'Create TODO'">Submit</span>
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
